<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | Pure Cinema</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0b0b0f;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
      cursor: default;
    }
    .container {
      max-width: 500px;
    }
    .error-code {
      font-size: 80px;
      font-weight: 900;
      color: #e50914;
      margin-bottom: 10px;
      letter-spacing: 4px;
    }
    img {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      margin-bottom: 15px;
      cursor: pointer;
      transition: 0.3s;
    }
    img:hover {
      transform: scale(1.02);
    }
    .home-btn {
      display: none;
      background: #e50914;
      color: white;
      padding: 12px 30px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      margin-top: 20px;
      display: inline-block;
    }
    .home-btn:hover {
      background: #b20710;
    }
    .home-btn.show {
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <img id="napoleonImg" src="/well.jpg" alt="Napoleon meme" />
    <a id="homeBtn" class="home-btn" href="/">Go Back Home</a>
  </div>

  <script>
    const img = document.getElementById('napoleonImg');
    const homeBtn = document.getElementById('homeBtn');
    let state = 0;

    img.addEventListener('click', function() {
      if (state === 0) {
        img.src = '/nothing.jpg';
        homeBtn.classList.add('show');
        state = 1;
      } else {
        img.src = '/well.jpg';
        homeBtn.classList.remove('show');
        state = 0;
      }
    });
  </script>
</body>
</html>
