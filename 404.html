<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dead End | Pure Cinema</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0b0b0f;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
      cursor: pointer;
    }
    .container {
      max-width: 600px;
    }
    img {
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      margin-bottom: 20px;
      transition: 0.3s;
      cursor: pointer;
    }
    img:hover {
      transform: scale(1.02);
    }
    .caption {
      font-size: 24px;
      font-weight: 700;
      color: #f5f5f5;
      margin-bottom: 8px;
      min-height: 40px;
    }
    .sub {
      color: #9b9ba5;
      font-size: 16px;
      margin-bottom: 25px;
    }
    a {
      background: #e50914;
      color: white;
      padding: 12px 30px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      display: inline-block;
    }
    a:hover {
      background: #b20710;
    }
  </style>
</head>
<body>
  <div class="container">
    <img id="napoleonImg" src="/well.jpg" alt="Napoleon meme" />
    <div id="captionText" class="caption">Well...</div>
    <div class="sub">Click the image to continue</div>
    <a href="/">Go Back Home</a>
  </div>

  <script>
    const img = document.getElementById('napoleonImg');
    const caption = document.getElementById('captionText');
    let state = 0;

    img.addEventListener('click', function() {
      if (state === 0) {
        img.src = '/nothing.jpg';
        caption.textContent = 'There is nothing we can do';
        state = 1;
      } else {
        img.src = '/well.jpg';
        caption.textContent = 'Well...';
        state = 0;
      }
    });
  </script>
</body>
</html>
