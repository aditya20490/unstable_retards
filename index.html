<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover movies, actors and trailers.">
  <title>Unstable Retards — Movies</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 22px 16px;
      text-align: center;
      background: #111116;
      border-bottom: 1px solid #25252d;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
    }

    .subtitle {
      color: #999;
      margin-top: 6px;
      font-size: 14px;
    }

    .search-box {
      padding: 18px 16px;
      max-width: 700px;
      margin: auto;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #18181f;
      color: white;
      font-size: 16px;
      outline: none;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 5px 16px 40px;
    }

    h2 {
      margin: 15px 0;
      font-size: 21px;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .movie {
      background: #15151b;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
    }

    .poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      display: block;
      background: #222;
    }

    .movie-info {
      padding: 11px;
    }

    .movie-title {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.3;
    }

    .movie-date {
      color: #999;
      font-size: 13px;
      margin-top: 6px;
    }

    .loading,
    .error {
      text-align: center;
      padding: 40px 10px;
      color: #aaa;
      grid-column: 1 / -1;
    }

    .details {
      display: none;
      max-width: 800px;
      margin: auto;
    }

    .back {
      display: inline-block;
      margin: 10px 0 20px;
      padding: 10px 15px;
      border-radius: 10px;
      background: #22222a;
      cursor: pointer;
    }

    .hero {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 18px;
    }

    .hero-poster {
      width: 150px;
      border-radius: 12px;
    }

    .details h1 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .rating {
      color: #ffd166;
      margin-bottom: 10px;
    }

    .genres {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 12px 0;
    }

    .genre {
      background: #292933;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
    }

    .overview {
      color: #ccc;
      line-height: 1.6;
      margin-top: 20px;
    }

    @media (min-width: 600px) {
      .movies {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 500px) {
      .hero {
        grid-template-columns: 120px 1fr;
      }

      .hero-poster {
        width: 120px;
      }

      .details h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Unstable Retards 🎬</div>
  <div class="subtitle">Discover movies, actors & trailers</div>
</header>

<div class="search-box">
  <input id="search" type="text" placeholder="Search movies...">
</div>

<main>

  <section id="home">
    <h2>🔥 Popular Movies</h2>

    <div id="movies" class="movies">
      <div class="loading">Loading movies...</div>
    </div>
  </section>

  <section id="details" class="details">
    <div class="back" onclick="goHome()">← Back to movies</div>

    <div id="movieDetails">
      <div class="loading">Loading...</div>
    </div>
  </section>

</main>

<script>
  const API = "https://movie-api.828477ww.workers.dev";

  async function loadPopular() {
    const container = document.getElementById("movies");

    try {
      const response = await fetch(API + "/popular");

      if (!response.ok) {
        throw new Error("API error");
      }

      const data = await response.json();

      displayMovies(data.results || []);

    } catch (error) {
      container.innerHTML =
        '<div class="error">Could not load movies.</div>';
    }
  }

  function displayMovies(movies) {
    const container = document.getElementById("movies");

    if (!movies.length) {
      container.innerHTML =
        '<div class="error">No movies found.</div>';
      return;
    }

    container.innerHTML = movies.map(movie => {

      const poster = movie.poster_path
        ? "https://image.tmdb.org/t/p/w500" + movie.poster_path
        : "";

      const year = movie.release_date
        ? movie.release_date.substring(0, 4)
        : "";

      return `
        <div class="movie" onclick="openMovie(${movie.id})">

          ${
            poster
            ? `<img class="poster" src="${poster}" alt="">`
            : `<div class="poster"></div>`
          }

          <div class="movie-info">
            <div class="movie-title">
              ${escapeHTML(movie.title)}
            </div>

            <div class="movie-date">
              ${year}
            </div>
          </div>

        </div>
      `;
    }).join("");
  }

  async function openMovie(id) {

    document.getElementById("home").style.display = "none";
    document.getElementById("details").style.display = "block";

    window.scrollTo(0, 0);

    const container = document.getElementById("movieDetails");

    container.innerHTML =
      '<div class="loading">Loading movie...</div>';

    try {

      const response = await fetch(API + "/movie/" + id);

      if (!response.ok) {
        throw new Error("Movie not found");
      }

      const movie = await response.json();

      const poster = movie.poster_path
        ? "https://image.tmdb.org/t/p/w500" + movie.poster_path
        : "";

      const genres = movie.genres || [];

      container.innerHTML = `
        <div class="hero">

          ${
            poster
            ? `<img class="hero-poster" src="${poster}" alt="">`
            : ""
          }

          <div>
            <h1>${escapeHTML(movie.title)}</h1>

            <div class="rating">
              ⭐ ${movie.vote_average
                ? movie.vote_average.toFixed(1)
                : "N/A"}
            </div>

            <div>
              ${movie.release_date || "Release date unknown"}
            </div>

            <div class="genres">
              ${genres.map(g =>
                `<span class="genre">${escapeHTML(g.name)}</span>`
              ).join("")}
            </div>
          </div>

        </div>

        <div class="overview">
          ${escapeHTML(movie.overview || "No description available.")}
        </div>
      `;

    } catch (error) {

      container.innerHTML =
        '<div class="error">Could not load movie details.</div>';
    }
  }

  function goHome() {
    document.getElementById("details").style.display = "none";
    document.getElementById("home").style.display = "block";
    window.scrollTo(0, 0);
  }

  document.getElementById("search").addEventListener("input", async function() {

    const query = this.value.trim();

    if (!query) {
      loadPopular();
      return;
    }

    try {

      const response = await fetch(
        API + "/search?query=" + encodeURIComponent(query)
      );

      const data = await response.json();

      displayMovies(data.results || []);

    } catch (error) {

      document.getElementById("movies").innerHTML =
        '<div class="error">Search failed.</div>';
    }
  });

  function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text || "";
    return div.innerHTML;
  }

  loadPopular();
</script>

</body>
</html>
