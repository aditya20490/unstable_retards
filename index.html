<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unstable Retards</title>

<style>
:root{
  --bg:#0b0b0f;
  --card:#141419;
  --text:#f5f5f5;
  --muted:#999;
  --accent:#ff4757;
  --border:#25252d;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(11,11,15,.95);
  backdrop-filter:blur(12px);
}

.logo{
  cursor:pointer;
  display:flex;
  align-items:center;
}

.logo img{
  width:180px;
  height:auto;
  display:block;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:14px;
}

.icon-btn{
  width:38px;
  height:38px;
  border:0;
  background:transparent;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:9px;
}

.icon-btn:hover{
  background:var(--card);
}

.icon-btn svg{
  width:21px;
  height:21px;
}

.search-wrap{
  max-width:900px;
  margin:22px auto 0;
  padding:0 18px;
  display:none;
}

.search-box{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 14px;
}

.search-box svg{
  width:20px;
  height:20px;
  color:var(--muted);
  flex-shrink:0;
}

.search-box input{
  width:100%;
  height:46px;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
}

.search-box input::placeholder{
  color:var(--muted);
}

main{
  max-width:1200px;
  margin:auto;
  padding:28px 18px 50px;
}

.popular-heading{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 0 22px;
  font-size:26px;
}

.popular-icon{
  width:23px;
  height:23px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  color:var(--accent);
}

.popular-icon svg{
  width:23px;
  height:23px;
}

.movie-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:20px;
}

.movie-card{
  background:var(--card);
  border:0;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:transform .2s ease;
}

.movie-card:hover{
  transform:translateY(-4px);
}

.poster{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  display:block;
  background:#1a1a20;
}

.movie-info{
  padding:11px;
}

.movie-title{
  font-size:15px;
  font-weight:700;
  line-height:1.3;
  margin-bottom:6px;
}

.movie-year{
  color:var(--muted);
  font-size:13px;
}

.rating{
  margin-top:6px;
  font-size:13px;
  color:#f5c542;
}

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin-top:30px;
  flex-wrap:wrap;
}

.page-btn{
  min-width:38px;
  height:36px;
  padding:0 10px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:8px;
}

.page-btn.active{
  background:var(--accent);
  border-color:var(--accent);
}

.page-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.menu{
  position:fixed;
  top:64px;
  right:18px;
  width:210px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:8px;
  z-index:200;
  display:none;
  box-shadow:0 12px 35px rgba(0,0,0,.4);
}

.menu.show{
  display:block;
}

.menu-item{
  padding:12px;
  border-radius:8px;
  cursor:pointer;
}

.menu-item:hover{
  background:#202027;
}

.skeleton-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:20px;
}

.skeleton-card{
  background:var(--card);
  border-radius:12px;
  overflow:hidden;
}

.skeleton-poster{
  aspect-ratio:2/3;
  background:linear-gradient(
    90deg,
    #15151b 25%,
    #202027 50%,
    #15151b 75%
  );
  background-size:200% 100%;
  animation:loading 1.3s infinite;
}

.skeleton-text{
  height:14px;
  margin:12px;
  border-radius:5px;
  background:#202027;
}

@keyframes loading{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

.detail-page{
  max-width:1050px;
  margin:auto;
}

.back-btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:10px 15px;
  border-radius:9px;
  margin-bottom:20px;
}

.detail-top,
.skeleton-detail-top{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:26px;
}

.detail-poster{
  width:100%;
  border-radius:12px;
  display:block;
}

.detail-title{
  font-size:32px;
  margin:0 0 10px;
}

.tag-row{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:12px 0;
}

.tag{
  border:1px solid var(--border);
  background:var(--card);
  border-radius:20px;
  padding:6px 10px;
  font-size:12px;
  color:var(--muted);
}

.overview{
  color:#ccc;
  line-height:1.6;
  font-size:15px;
}

.details-box{
  margin-top:22px;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  padding:14px;
}

.info-row{
  display:flex;
  gap:14px;
  padding:9px;
  border-bottom:1px solid var(--border);
}

.info-row:last-child{
  border-bottom:0;
}

.info-label{
  color:var(--muted);
  min-width:100px;
}

.cast-section{
  margin-top:30px;
}

.section-title{
  font-size:22px;
  margin-bottom:16px;
}

.cast-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:15px;
}

.cast-card{
  cursor:pointer;
}

.cast-photo{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:10px;
  background:#18181f;
}

.cast-name{
  font-size:13px;
  font-weight:bold;
  margin-top:7px;
}

.cast-character{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.trailer-btn{
  margin-top:16px;
  border:0;
  background:var(--accent);
  color:white;
  padding:11px 16px;
  border-radius:9px;
  font-weight:bold;
}

.related-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:18px;
}

.person-top{
  display:grid;
  grid-template-columns:220px 1fr;
  gap:25px;
}

.person-photo{
  width:100%;
  border-radius:12px;
}

.person-bio{
  color:#ccc;
  line-height:1.6;
}

.person-credits{
  margin-top:30px;
}

.about{
  max-width:800px;
  margin:auto;
}

.about h1{
  font-size:30px;
  margin-bottom:10px;
}

.about-section{
  margin-top:28px;
}

.about-section h2{
  font-size:21px;
}

.about-section p{
  color:#ccc;
  line-height:1.7;
}

.genre-grid{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.genre-btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:10px 14px;
  border-radius:20px;
}

.genre-btn:hover{
  border-color:var(--accent);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:500;
  padding:18px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(900px,100%);
  background:#111116;
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  position:relative;
}

.modal-close{
  position:absolute;
  right:10px;
  top:10px;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  color:white;
  z-index:2;
  font-size:20px;
}

.trailer-frame{
  width:100%;
  aspect-ratio:16/9;
  border:0;
  display:block;
}

footer{
  border-top:1px solid var(--border);
  padding:25px 18px;
  text-align:center;
  color:var(--muted);
}

.footer-links{
  margin-bottom:12px;
}

.footer-link{
  cursor:pointer;
}

.footer-link:hover{
  color:var(--text);
}

.footer-credit{
  font-size:13px;
}

.error{
  text-align:center;
  color:#ff6975;
  padding:40px 10px;
}

@media(max-width:1000px){
  .movie-grid,
  .skeleton-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .cast-grid{
    grid-template-columns:repeat(5,1fr);
  }

  .related-grid{
    grid-template-columns:repeat(4,1fr);
  }
}

@media(max-width:650px){

  header{
    height:58px;
    padding:0 14px;
  }

  .logo img{
    width:150px;
  }

  .header-actions{
    gap:4px;
  }

  .icon-btn{
    width:36px;
    height:36px;
  }

  .menu{
    top:58px;
    right:12px;
  }

  main{
    padding:22px 12px 40px;
  }

  .popular-heading{
    font-size:22px;
    margin-bottom:17px;
  }

  .movie-grid,
  .skeleton-grid{
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }

  .movie-title{
    font-size:14px;
  }

  .pagination{
    flex-wrap:nowrap;
    overflow:hidden;
    gap:5px;
  }

  .page-btn{
    min-width:34px;
    padding:0 7px;
  }

  .detail-top,
  .skeleton-detail-top{
    grid-template-columns:160px 1fr;
    gap:16px;
  }

  .back-btn{
    padding:8px 12px;
    font-size:14px;
    border-radius:8px;
    margin-bottom:16px;
  }

  .detail-title{
    font-size:24px;
  }

  .overview{
    font-size:14px;
  }

  .details-box{
    padding:8px;
  }

  .info-row{
    padding:8px;
    gap:10px;
    font-size:13px;
  }

  .cast-grid{
    grid-template-columns:repeat(3,1fr);
    gap:12px;
  }

  .related-grid{
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }

  .person-top{
    grid-template-columns:140px 1fr;
    gap:16px;
  }
}

@media(max-width:450px){

  .detail-top,
  .skeleton-detail-top{
    grid-template-columns:1fr;
  }

  .detail-poster{
    max-width:220px;
  }

  .person-top{
    grid-template-columns:1fr;
  }

  .person-photo{
    max-width:220px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo" onclick="goHome()">
    <img src="IMG_20260905_030014.jpg" alt="Unstable Retards">
  </div>

  <div class="header-actions">

    <button class="icon-btn" onclick="toggleSearch()" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round">
        <circle cx="11" cy="11" r="6.5"></circle>
        <path d="M16 16L21 21"></path>
      </svg>
    </button>

    <button class="icon-btn" onclick="toggleTheme()" aria-label="Theme">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2V4"></path>
        <path d="M12 20V22"></path>
        <path d="M4.93 4.93L6.34 6.34"></path>
        <path d="M17.66 17.66L19.07 19.07"></path>
        <path d="M2 12H4"></path>
        <path d="M20 12H22"></path>
        <path d="M4.93 19.07L6.34 17.66"></path>
        <path d="M17.66 6.34L19.07 4.93"></path>
      </svg>
    </button>

    <button class="icon-btn" onclick="toggleMenu()" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round">
        <path d="M4 7H20"></path>
        <path d="M4 12H20"></path>
        <path d="M4 17H20"></path>
      </svg>
    </button>

  </div>
</header>

<div class="search-wrap" id="searchWrap">
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round">
      <circle cx="11" cy="11" r="6.5"></circle>
      <path d="M16 16L21 21"></path>
    </svg>

    <input
      id="searchInput"
      type="text"
      placeholder="Search movies..."
      autocomplete="off"
      oninput="handleSearch(this.value)"
    >
  </div>
</div>

<div class="menu" id="menu">

  <div class="menu-item" onclick="loadCategory('popular')">
    Popular Movies
  </div>

  <div class="menu-item" onclick="loadCategory('top-rated')">
    Top Rated
  </div>

  <div class="menu-item" onclick="loadCategory('now-playing')">
    Now Playing
  </div>

  <div class="menu-item" onclick="loadCategory('upcoming')">
    Upcoming
  </div>

  <div class="menu-item" onclick="showAbout()">
    About Us
  </div>

  <div class="menu-item" onclick="showGenres()">
    Genres
  </div>

</div>

<main id="app"></main>

<footer>

  <div class="footer-links">
    <span class="footer-link" onclick="showAbout()">
      About Us
    </span>
  </div>

  <div class="footer-credit">
    Made by Aditya Chauhan • 2026
  </div>

</footer>

<div class="modal" id="trailerModal" onclick="closeTrailer(event)">
  <div class="modal-box">

    <button class="modal-close" onclick="closeTrailer()">
      ×
    </button>

    <iframe
      id="trailerFrame"
      class="trailer-frame"
      allowfullscreen
      allow="autoplay; encrypted-media"
    ></iframe>

  </div>
</div>

<script>

const API = "https://movie-api.828477ww.workers.dev";
const IMAGE = "https://image.tmdb.org/t/p/w500";

let currentPage = 1;
let currentCategory = "popular";
let searchTimer = null;

const app = document.getElementById("app");

function escapeHTML(str){

  if(str === null || str === undefined) return "";

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatDate(date){

  if(!date) return "Unknown";

  return date.split("-")[0];
}

function image(path){

  if(!path){
    return "https://via.placeholder.com/500x750/18181f/999999?text=No+Image";
  }

  return IMAGE + path;
}

async function api(path){

  const response = await fetch(API + path);

  if(!response.ok){
    throw new Error("API request failed");
  }

  return response.json();
}

function skeletons(){

  return `
    <div class="skeleton-grid">
      ${Array.from({length:10}).map(() => `
        <div class="skeleton-card">
          <div class="skeleton-poster"></div>
          <div class="skeleton-text"></div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderMovies(data,title="Popular Movies"){

  const movies = data.results || [];

  if(!movies.length){

    app.innerHTML = `
      <div class="error">
        No movies found.
      </div>
    `;

    return;
  }

  app.innerHTML = `

    <h1 class="popular-heading">

      ${
        title === "Popular Movies"
          ? `
            <span class="popular-icon" aria-hidden="true">

              <svg viewBox="0 0 24 24"
                   fill="none"
                   stroke="currentColor"
                   stroke-width="1.7"
                   stroke-linecap="round"
                   stroke-linejoin="round">

                <path d="M12.5 21C8.4 21 5 18.3 5 14.2C5 10.8 7.1 8.7 9.2 6.1C10.2 4.8 10.9 3.2 10.7 2C14.7 4.2 16.5 7.1 16.2 10.1C17.4 9.5 18.1 8.6 18.3 7.4C20.2 9.4 21 11.5 21 14.1C21 18.2 17.8 21 12.5 21Z"></path>

                <path d="M12.2 17.8C10.8 17.8 9.7 16.8 9.7 15.4C9.7 14.1 10.5 13.2 11.4 12.1C11.8 11.6 12.1 11 12 10.5C13.6 11.5 14.3 12.7 14.1 14C14.7 13.7 15.1 13.3 15.2 12.8C15.9 13.7 16.1 14.6 16.1 15.5C16.1 16.9 14.9 17.8 12.2 17.8Z"></path>

              </svg>

            </span>
          `
          : ""
      }

      <span>${escapeHTML(title)}</span>

    </h1>

    <div class="movie-grid">

      ${movies.map(movie => `

        <div class="movie-card"
             onclick="showMovie(${movie.id})">

          <img
            class="poster"
            src="${image(movie.poster_path)}"
            alt="${escapeHTML(movie.title)}"
            loading="lazy"
          >

          <div class="movie-info">

            <div class="movie-title">
              ${escapeHTML(movie.title)}
            </div>

            <div class="movie-year">
              ${formatDate(movie.release_date)}
            </div>

            <div class="rating">
              ★ ${movie.vote_average ? movie.vote_average.toFixed(1) : "N/A"}
            </div>

          </div>

        </div>

      `).join("")}

    </div>

    ${renderPagination(data.total_pages || 1)}

  `;
}

function renderPagination(totalPages){

  const maxButtons = window.innerWidth <= 650 ? 6 : 8;

  let start = Math.max(
    1,
    currentPage - Math.floor(maxButtons / 2)
  );

  let end = Math.min(
    totalPages,
    start + maxButtons - 1
  );

  if(end - start + 1 < maxButtons){
    start = Math.max(1,end - maxButtons + 1);
  }

  return `

    <div class="pagination">

      <button
        class="page-btn"
        onclick="changePage(${currentPage - 1})"
        ${currentPage <= 1 ? "disabled" : ""}
      >
        ‹
      </button>

      ${Array.from(
        {length:end-start+1},
        (_,i) => start+i
      ).map(page => `

        <button
          class="page-btn ${page === currentPage ? "active" : ""}"
          onclick="changePage(${page})"
        >
          ${page}
        </button>

      `).join("")}

      <button
        class="page-btn"
        onclick="changePage(${currentPage + 1})"
        ${currentPage >= totalPages ? "disabled" : ""}
      >
        ›
      </button>

    </div>

  `;
}

async function loadCategory(category,page=1){

  currentCategory = category;
  currentPage = page;

  closeMenu();

  app.innerHTML = skeletons();

  try{

    const data = await api(
      `/${category}?page=${page}`
    );

    let title = "Popular Movies";

    if(category === "top-rated")
      title = "Top Rated";

    if(category === "now-playing")
      title = "Now Playing";

    if(category === "upcoming")
      title = "Upcoming";

    renderMovies(data,title);

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }catch(error){

    app.innerHTML = `
      <div class="error">
        Something went wrong. Please try again.
      </div>
    `;
  }
}

function changePage(page){

  if(page < 1) return;

  loadCategory(currentCategory,page);
}

function goHome(){

  loadCategory("popular",1);
}

function toggleMenu(){

  document
    .getElementById("menu")
    .classList.toggle("show");
}

function closeMenu(){

  document
    .getElementById("menu")
    .classList.remove("show");
}

function toggleSearch(){

  const box = document.getElementById("searchWrap");

  const visible =
    box.style.display === "block";

  box.style.display =
    visible ? "none" : "block";

  if(!visible){

    document
      .getElementById("searchInput")
      .focus();
  }
}

function handleSearch(value){

  clearTimeout(searchTimer);

  const query = value.trim();

  if(!query){

    loadCategory("popular",1);
    return;
  }

  searchTimer = setTimeout(
    () => searchMovies(query,1),
    400
  );
}

async function searchMovies(query,page=1){

  app.innerHTML = skeletons();

  try{

    const data = await api(
      `/search?query=${encodeURIComponent(query)}&page=${page}`
    );

    currentCategory = "search";
    currentPage = page;

    renderMovies(
      data,
      `Search results for "${query}"`
    );

  }catch(error){

    app.innerHTML = `
      <div class="error">
        Search failed. Please try again.
      </div>
    `;
  }
}

async function showMovie(id){

  closeMenu();

  app.innerHTML = `
    <div class="detail-page">
      <button class="back-btn" onclick="goHome()">
        ← Back
      </button>
      ${skeletons()}
    </div>
  `;

  try{

    const [movie,credits,videos] =
      await Promise.all([
        api(`/movie/${id}`),
        api(`/movie/${id}/credits`),
        api(`/movie/${id}/videos`)
      ]);

    renderMovieDetails(
      movie,
      credits,
      videos
    );

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }catch(error){

    app.innerHTML = `
      <div class="detail-page">

        <button class="back-btn" onclick="goHome()">
          ← Back
        </button>

        <div class="error">
          Could not load movie details.
        </div>

      </div>
    `;
  }
}

function renderMovieDetails(
  movie,
  credits,
  videos
){

  const genres =
    (movie.genres || [])
      .map(g => `
        <span class="tag">
          ${escapeHTML(g.name)}
        </span>
      `)
      .join("");

  const directors =
    (credits.crew || [])
      .filter(person => person.job === "Director")
      .slice(0,4);

  const cast =
    (credits.cast || [])
      .slice(0,12);

  const trailer =
    (videos.results || []).find(
      video =>
        video.site === "YouTube" &&
        video.type === "Trailer" &&
        video.official !== false
    ) ||
    (videos.results || []).find(
      video =>
        video.site === "YouTube" &&
        video.type === "Trailer"
    );

  app.innerHTML = `

    <div class="detail-page">

      <button class="back-btn" onclick="goHome()">
        ← Back
      </button>

      <div class="detail-top">

        <img
          class="detail-poster"
          src="${image(movie.poster_path)}"
          alt="${escapeHTML(movie.title)}"
        >

        <div>

          <h1 class="detail-title">
            ${escapeHTML(movie.title)}
          </h1>

          <div class="movie-year">
            ${formatDate(movie.release_date)}
            ${movie.runtime ? ` • ${movie.runtime} min` : ""}
          </div>

          <div class="tag-row">
            ${genres}
          </div>

          <div class="overview">
            ${escapeHTML(
              movie.overview || "No overview available."
            )}
          </div>

          ${
            trailer
              ? `
                <button
                  class="trailer-btn"
                  onclick="openTrailer('${trailer.key}')"
                >
                  ▶ Watch Trailer
                </button>
              `
              : ""
          }

        </div>

      </div>

      <div class="details-box">

        <div class="info-row">
          <div class="info-label">Rating</div>
          <div>
            ★ ${movie.vote_average
              ? movie.vote_average.toFixed(1)
              : "N/A"}
          </div>
        </div>

        <div class="info-row">
          <div class="info-label">Release Date</div>
          <div>
            ${escapeHTML(movie.release_date || "Unknown")}
          </div>
        </div>

        ${
          movie.original_language
            ? `
              <div class="info-row">
                <div class="info-label">Language</div>
                <div>
                  ${escapeHTML(
                    movie.original_language.toUpperCase()
                  )}
                </div>
              </div>
            `
            : ""
        }

        ${
          directors.length
            ? `
              <div class="info-row">
                <div class="info-label">Director</div>
                <div>
                  ${directors.map(
                    director => `
                      <span
                        style="cursor:pointer"
                        onclick="showPerson(${director.id})"
                      >
                        ${escapeHTML(director.name)}
                      </span>
                    `
                  ).join(", ")}
                </div>
              </div>
            `
            : ""
        }

      </div>

      ${
        cast.length
          ? `
            <div class="cast-section">

              <div class="section-title">
                Cast
              </div>

              <div class="cast-grid">

                ${cast.map(person => `

                  <div
                    class="cast-card"
                    onclick="showPerson(${person.id})"
                  >

                    <img
                      class="cast-photo"
                      src="${image(person.profile_path)}"
                      alt="${escapeHTML(person.name)}"
                      loading="lazy"
                    >

                    <div class="cast-name">
                      ${escapeHTML(person.name)}
                    </div>

                    <div class="cast-character">
                      ${escapeHTML(person.character || "")}
                    </div>

                  </div>

                `).join("")}

              </div>

            </div>
          `
          : ""
      }

      <div id="relatedMovies"></div>

    </div>

  `;

  loadRelatedMovies(movie);
}

async function loadRelatedMovies(movie){

  try{

    const genres =
      (movie.genres || [])
        .map(g => g.id)
        .join("|");

    if(!genres) return;

    const data = await api(
      `/discover?with_genres=${encodeURIComponent(
        genres.split("|")[0]
      )}&sort_by=popularity.desc&page=1`
    );

    const related =
      (data.results || [])
        .filter(item => item.id !== movie.id)
        .slice(0,5);

    if(!related.length) return;

    document.getElementById(
      "relatedMovies"
    ).innerHTML = `

      <div class="cast-section">

        <div class="section-title">
          You May Also Like
        </div>

        <div class="related-grid">

          ${related.map(item => `

            <div
              class="movie-card"
              onclick="showMovie(${item.id})"
            >

              <img
                class="poster"
                src="${image(item.poster_path)}"
                alt="${escapeHTML(item.title)}"
                loading="lazy"
              >

              <div class="movie-info">

                <div class="movie-title">
                  ${escapeHTML(item.title)}
                </div>

                <div class="movie-year">
                  ${formatDate(item.release_date)}
                </div>

                <div class="rating">
                  ★ ${item.vote_average
                    ? item.vote_average.toFixed(1)
                    : "N/A"}
                </div>

              </div>

            </div>

          `).join("")}

        </div>

      </div>

    `;

  }catch(error){

    console.log(error);
  }
}

async function showPerson(id){

  app.innerHTML = `
    <div class="detail-page">

      <button class="back-btn" onclick="history.back()">
        ← Back
      </button>

      <div class="error">
        Loading...
      </div>

    </div>
  `;

  try{

    const [person,credits] =
      await Promise.all([
        api(`/person/${id}`),
        api(`/person/${id}/credits`)
      ]);

    renderPerson(
      person,
      credits
    );

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }catch(error){

    app.innerHTML = `
      <div class="error">
        Could not load actor information.
      </div>
    `;
  }
}

function renderPerson(person,credits){

  const movies =
    (credits.cast || [])
      .filter(movie => movie.poster_path)
      .sort(
        (a,b) =>
          (b.popularity || 0) -
          (a.popularity || 0)
      )
      .slice(0,30);

  app.innerHTML = `

    <div class="detail-page">

      <button
        class="back-btn"
        onclick="goHome()"
      >
        ← Back
      </button>

      <div class="person-top">

        <img
          class="person-photo"
          src="${image(person.profile_path)}"
          alt="${escapeHTML(person.name)}"
        >

        <div>

          <h1 class="detail-title">
            ${escapeHTML(person.name)}
          </h1>

          ${
            person.known_for_department
              ? `
                <div class="movie-year">
                  ${escapeHTML(
                    person.known_for_department
                  )}
                </div>
              `
              : ""
          }

          ${
            person.birthday
              ? `
                <div class="movie-year" style="margin-top:8px;">
                  Born: ${escapeHTML(person.birthday)}
                </div>
              `
              : ""
          }

          ${
            person.place_of_birth
              ? `
                <div class="movie-year" style="margin-top:5px;">
                  ${escapeHTML(person.place_of_birth)}
                </div>
              `
              : ""
          }

          <p class="person-bio">
            ${escapeHTML(
              person.biography ||
              "No biography available."
            )}
          </p>

        </div>

      </div>

      ${
        movies.length
          ? `
            <div class="person-credits">

              <div class="section-title">
                Filmography
              </div>

              <div class="related-grid">

                ${movies.map(movie => `

                  <div
                    class="movie-card"
                    onclick="showMovie(${movie.id})"
                  >

                    <img
                      class="poster"
                      src="${image(movie.poster_path)}"
                      alt="${escapeHTML(movie.title || movie.name)}"
                      loading="lazy"
                    >

                    <div class="movie-info">

                      <div class="movie-title">
                        ${escapeHTML(
                          movie.title || movie.name
                        )}
                      </div>

                      <div class="movie-year">
                        ${formatDate(
                          movie.release_date ||
                          movie.first_air_date
                        )}
                      </div>

                    </div>

                  </div>

                `).join("")}

              </div>

            </div>
          `
          : ""
      }

    </div>

  `;
}

function openTrailer(key){

  if(!key) return;

  document.getElementById(
    "trailerFrame"
  ).src =
    "https://www.youtube.com/embed/" +
    encodeURIComponent(key) +
    "?autoplay=1";

  document.getElementById(
    "trailerModal"
  ).classList.add("show");
}

function closeTrailer(event){

  if(
    event &&
    event.target &&
    event.target.id !== "trailerModal"
  ){
    return;
  }

  document.getElementById(
    "trailerModal"
  ).classList.remove("show");

  document.getElementById(
    "trailerFrame"
  ).src = "";
}

function toggleTheme(){

  const root =
    document.documentElement;

  const current =
    getComputedStyle(root)
      .getPropertyValue("--bg")
      .trim();

  if(current === "#0b0b0f"){

    root.style.setProperty(
      "--bg",
      "#f5f5f5"
    );

    root.style.setProperty(
      "--card",
      "#ffffff"
    );

    root.style.setProperty(
      "--text",
      "#111111"
    );

    root.style.setProperty(
      "--muted",
      "#666666"
    );

    root.style.setProperty(
      "--border",
      "#dddddd"
    );

  }else{

    root.style.setProperty(
      "--bg",
      "#0b0b0f"
    );

    root.style.setProperty(
      "--card",
      "#141419"
    );

    root.style.setProperty(
      "--text",
      "#f5f5f5"
    );

    root.style.setProperty(
      "--muted",
      "#999"
    );

    root.style.setProperty(
      "--border",
      "#25252d"
    );
  }
}

document.addEventListener(
  "click",
  function(event){

    const menu =
      document.getElementById("menu");

    const button =
      event.target.closest(".icon-btn");

    if(
      menu.classList.contains("show") &&
      !menu.contains(event.target) &&
      !button
    ){
      closeMenu();
    }

  }
);

goHome();
