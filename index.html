<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover movies, actors and trailers.">
  <title>Unstable Retards — Movies</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 22px 16px;
      text-align: center;
      background: #111116;
      border-bottom: 1px solid #25252d;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
    }

    .subtitle {
      color: #999;
      margin-top: 6px;
      font-size: 14px;
    }

    .search-box {
      padding: 18px 16px;
      max-width: 700px;
      margin: auto;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #18181f;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #777;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 5px 16px 40px;
    }

    h2 {
      margin: 15px 0;
      font-size: 21px;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .movie {
      background: #15151b;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .movie:hover {
      transform: translateY(-3px);
    }

    .poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      display: block;
      background: #222;
    }

    .movie-info {
      padding: 11px;
    }

    .movie-title {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.3;
    }

    .movie-date {
      color: #999;
      font-size: 13px;
      margin-top: 6px;
    }

    .loading,
    .error {
      text-align: center;
      padding: 40px 10px;
      color: #aaa;
    }

    @media (min-width: 600px) {
      .movies {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Unstable Retards 🎬</div>
    <div class="subtitle">Discover movies, actors & trailers</div>
  </header>

  <div class="search-box">
    <input
      id="search"
      type="text"
      placeholder="Search movies..."
    >
  </div>

  <main>
    <h2>🔥 Popular Movies</h2>

    <div id="movies" class="movies">
      <div class="loading">Loading movies...</div>
    </div>
  </main>

  <script>
    const API = "https://movie-api.828477ww.workers.dev";

    let movies = [];

    async function loadMovies() {
      const container = document.getElementById("movies");

      try {
        const response = await fetch(API + "/popular");

        if (!response.ok) {
          throw new Error("API request failed");
        }

        const data = await response.json();
        movies = data.results || [];

        displayMovies(movies);

      } catch (error) {
        container.innerHTML =
          '<div class="error">Could not load movies. Please try again.</div>';

        console.error(error);
      }
    }

    function displayMovies(list) {
      const container = document.getElementById("movies");

      if (list.length === 0) {
        container.innerHTML =
          '<div class="error">No movies found.</div>';
        return;
      }

      container.innerHTML = list.map(movie => {

        const poster = movie.poster_path
          ? "https://image.tmdb.org/t/p/w500" + movie.poster_path
          : "";

        const year = movie.release_date
          ? movie.release_date.substring(0, 4)
          : "Unknown";

        return `
          <div class="movie" onclick="openMovie(${movie.id})">

            ${
              poster
              ? `<img class="poster" src="${poster}" alt="${escapeHTML(movie.title)}">`
              : `<div class="poster"></div>`
            }

            <div class="movie-info">
              <div class="movie-title">
                ${escapeHTML(movie.title)}
              </div>

              <div class="movie-date">
                ${year}
              </div>
            </div>

          </div>
        `;
      }).join("");
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text || "";
      return div.innerHTML;
    }

    function openMovie(id) {
      alert("Movie details coming next!");
    }

    document.getElementById("search").addEventListener("input", function() {
      const query = this.value.toLowerCase().trim();

      if (!query) {
        displayMovies(movies);
        return;
      }

      const filtered = movies.filter(movie =>
        movie.title.toLowerCase().includes(query)
      );

      displayMovies(filtered);
    });

    loadMovies();
  </script>

</body>
</html>
