<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unstable Retards 🎬</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#0b0b0f;
  --card:#15151c;
  --card2:#1c1c25;
  --text:#f5f5f5;
  --muted:#9b9ba5;
  --accent:#e50914;
  --border:#292933;
}

body.light{
  --bg:#f5f5f7;
  --card:#ffffff;
  --card2:#eeeeF2;
  --text:#111;
  --muted:#666;
  --border:#ddd;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.2s;
}

button,input{
  font:inherit;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(11,11,15,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

body.light header{
  background:rgba(245,245,247,.94);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  font-size:21px;
  font-weight:800;
  white-space:nowrap;
}

.header-spacer{
  flex:1;
}

.icon-btn{
  border:0;
  background:var(--card);
  color:var(--text);
  width:42px;
  height:42px;
  border-radius:12px;
  cursor:pointer;
  font-size:20px;
}

.search-wrap{
  max-width:1200px;
  margin:auto;
  padding:12px 16px 16px;
}

#searchInput{
  width:100%;
  padding:14px 16px;
  border-radius:13px;
  border:1px solid var(--border);
  outline:none;
  background:var(--card);
  color:var(--text);
}

#searchInput::placeholder{
  color:var(--muted);
}

main{
  max-width:1200px;
  margin:auto;
  padding:24px 16px 50px;
}

.hero{
  margin-bottom:28px;
}

.hero h1{
  font-size:30px;
  margin-bottom:7px;
}

.hero p{
  color:var(--muted);
}

.section{
  margin-top:30px;
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.section-header h2{
  font-size:22px;
}

.movie-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.movie-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:transform .18s,border-color .18s;
}

.movie-card:hover{
  transform:translateY(-3px);
  border-color:#555;
}

.poster{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  display:block;
  background:#222;
}

.movie-info{
  padding:11px;
}

.movie-title{
  font-weight:700;
  line-height:1.3;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.movie-meta{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:24px;
  flex-wrap:wrap;
}

.page-btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:9px 13px;
  border-radius:9px;
  cursor:pointer;
}

.page-btn.active{
  background:var(--accent);
  border-color:var(--accent);
  color:white;
}

.page-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* DETAILS */

.detail{
  max-width:1000px;
  margin:auto;
}

.back-btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:20px;
}

.detail-top{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:25px;
}

.detail-poster{
  width:100%;
  border-radius:14px;
  display:block;
}

.detail-content h1{
  font-size:34px;
  line-height:1.15;
  margin-bottom:10px;
}

.tag-row{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:13px 0;
}

.tag{
  background:var(--card2);
  border:1px solid var(--border);
  padding:6px 10px;
  border-radius:999px;
  color:var(--muted);
  font-size:13px;
}

.overview{
  color:var(--muted);
  line-height:1.7;
  margin-top:12px;
}

.watch-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:18px;
  border:0;
  background:var(--accent);
  color:white;
  padding:12px 18px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

.details-box{
  margin-top:28px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
}

.info-row{
  display:grid;
  grid-template-columns:110px 1fr;
  gap:14px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}

.info-row:last-child{
  border-bottom:0;
}

.info-label{
  font-weight:800;
}

.info-value{
  color:var(--muted);
  line-height:1.6;
}

.cast-name{
  color:var(--text);
}

.character{
  color:var(--muted);
}

.related-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

/* TRAILER MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.82);
}

.modal.show{
  display:flex;
}

.trailer-box{
  width:min(850px,100%);
  background:#111118;
  border:1px solid #333;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 20px 70px rgba(0,0,0,.7);
}

.trailer-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:15px 17px;
}

.trailer-title{
  font-weight:800;
  font-size:17px;
}

.close-btn{
  border:0;
  background:#24242d;
  color:white;
  width:35px;
  height:35px;
  border-radius:9px;
  cursor:pointer;
  font-size:20px;
}

.video-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}

.video-wrap iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}

/* MENU */

.menu{
  position:fixed;
  top:0;
  right:-310px;
  width:290px;
  height:100%;
  background:var(--card);
  border-left:1px solid var(--border);
  z-index:100;
  transition:.25s;
  padding:20px;
  overflow-y:auto;
}

.menu.open{
  right:0;
}

.menu-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.menu-title{
  font-size:20px;
  font-weight:800;
}

.menu-item{
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:var(--text);
  padding:13px 10px;
  border-radius:9px;
  cursor:pointer;
}

.menu-item:hover{
  background:var(--card2);
}

.menu-section{
  margin-top:20px;
  margin-bottom:7px;
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.menu-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:90;
  display:none;
}

.menu-overlay.show{
  display:block;
}

.loading,
.empty,
.error{
  text-align:center;
  padding:45px 10px;
  color:var(--muted);
}

footer{
  max-width:1200px;
  margin:auto;
  padding:25px 16px 40px;
  color:var(--muted);
  font-size:12px;
  text-align:center;
}

@media(min-width:650px){
  .movie-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .related-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(min-width:900px){
  .movie-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .related-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:650px){
  .logo{
    font-size:18px;
  }

  .detail-top{
    grid-template-columns:140px 1fr;
    gap:16px;
  }

  .detail-content h1{
    font-size:23px;
  }

  .info-row{
    grid-template-columns:90px 1fr;
  }
}

@media(max-width:450px){
  .detail-top{
    grid-template-columns:1fr;
  }

  .detail-poster{
    max-width:220px;
    margin:auto;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">Unstable Retards 🎬</div>
    <div class="header-spacer"></div>

    <button class="icon-btn" onclick="toggleTheme()" aria-label="Theme">
      🌓
    </button>

    <button class="icon-btn" onclick="openMenu()" aria-label="Menu">
      ☰
    </button>
  </div>

  <div class="search-wrap">
    <input
      id="searchInput"
      type="search"
      placeholder="Search movies..."
      autocomplete="off"
    >
  </div>
</header>

<div id="menuOverlay" class="menu-overlay" onclick="closeMenu()"></div>

<aside id="menu" class="menu">

  <div class="menu-top">
    <div class="menu-title">Explore</div>
    <button class="close-btn" onclick="closeMenu()">×</button>
  </div>

  <button class="menu-item" onclick="loadHomeSection('popular')">
    🔥 Popular
  </button>

  <button class="menu-item" onclick="loadHomeSection('top-rated')">
    ⭐ Top Rated
  </button>

  <button class="menu-item" onclick="loadHomeSection('now-playing')">
    🎬 Now Playing
  </button>

  <button class="menu-item" onclick="loadHomeSection('upcoming')">
    🚀 Upcoming
  </button>

  <div class="menu-section">Genres</div>

  <div id="genreMenu"></div>

</aside>

<main id="app"></main>

<footer>
  This product uses the TMDB API but is not endorsed or certified by TMDB.
</footer>

<!-- TRAILER POPUP -->

<div id="trailerModal" class="modal" onclick="handleModalBackground(event)">
  <div class="trailer-box">

    <div class="trailer-header">
      <div id="trailerTitle" class="trailer-title">
        Official Trailer
      </div>

      <button class="close-btn" onclick="closeTrailer()">
        ×
      </button>
    </div>

    <div class="video-wrap">
      <iframe
        id="trailerFrame"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

  </div>
</div>

<script>

const API = "https://movie-api.828477ww.workers.dev";

const IMAGE = "https://image.tmdb.org/t/p/w500";

const BACKDROP = "https://image.tmdb.org/t/p/original";

let currentPage = 1;
let currentSection = "popular";
let currentMovieId = null;

let searchTimer = null;

let currentMovie = null;
let currentTrailer = null;


/* -------------------------
   BASIC HELPERS
------------------------- */

function escapeHTML(value){
  if(value === null || value === undefined) return "";

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function poster(path){

  if(!path){
    return "https://via.placeholder.com/500x750?text=No+Poster";
  }

  return IMAGE + path;
}


function formatDate(date){

  if(!date) return "Not available";

  const d = new Date(date + "T00:00:00");

  if(Number.isNaN(d.getTime())) return date;

  return d.toLocaleDateString("en-US",{
    year:"numeric",
    month:"long",
    day:"numeric"
  });
}


async function getJSON(url){

  const response = await fetch(url);

  if(!response.ok){
    throw new Error("Request failed");
  }

  return await response.json();
}


/* -------------------------
   HOME
------------------------- */

async function loadHomeSection(section){

  closeMenu();

  currentSection = section;
  currentPage = 1;

  window.history.pushState(
    {page:"home",section},
    "",
    window.location.pathname
  );

  await loadMovies(section,1);
}


async function loadMovies(section,page){

  const app = document.getElementById("app");

  app.innerHTML = `<div class="loading">Loading movies...</div>`;

  try{

    const data = await getJSON(
      API + "/" + section + "?page=" + page
    );

    renderMovies(
      data.results || [],
      section === "popular" ? "Popular Movies" :
      section === "top-rated" ? "Top Rated Movies" :
      section === "now-playing" ? "Now Playing" :
      section === "upcoming" ? "Upcoming Movies" :
      "Movies"
    );

    renderPagination(
      data.page || page,
      data.total_pages || 1,
      function(newPage){
        currentPage = newPage;
        loadMovies(section,newPage);
        window.scrollTo({top:0,behavior:"smooth"});
      }
    );

  }catch(error){

    app.innerHTML = `
      <div class="error">
        Unable to load movies right now.
      </div>
    `;

  }
}


function renderMovies(movies,title){

  const app = document.getElementById("app");

  if(!movies.length){

    app.innerHTML = `
      <div class="empty">
        No movies found.
      </div>
    `;

    return;
  }

  app.innerHTML = `

    <div class="hero">
      <h1>${escapeHTML(title)}</h1>
      <p>Discover movies, actors & trailers.</p>
    </div>

    <section class="section">

      <div class="movie-grid">

        ${movies.map(movieCard).join("")}

      </div>

    </section>
  `;
}


function movieCard(movie){

  const year = movie.release_date
    ? movie.release_date.slice(0,4)
    : "";

  return `

    <article
      class="movie-card"
      onclick="showMovie(${movie.id})"
    >

      <img
        class="poster"
        src="${poster(movie.poster_path)}"
        alt="${escapeHTML(movie.title || "Movie")}"
        loading="lazy"
      >

      <div class="movie-info">

        <div class="movie-title">
          ${escapeHTML(movie.title)}
        </div>

        <div class="movie-meta">
          ${escapeHTML(year)}
          ${movie.vote_average ? " • ⭐ " + movie.vote_average.toFixed(1) : ""}
        </div>

      </div>

    </article>
  `;
}


/* -------------------------
   PAGINATION
------------------------- */

function renderPagination(page,totalPages,callback){

  const app = document.getElementById("app");

  if(totalPages <= 1) return;

  const existing = document.querySelector(".pagination");

  if(existing) existing.remove();

  const pagination = document.createElement("div");

  pagination.className = "pagination";

  const maxButtons = 7;

  let start = Math.max(1,page - 3);
  let end = Math.min(totalPages,start + maxButtons - 1);

  if(end - start < maxButtons - 1){
    start = Math.max(1,end - maxButtons + 1);
  }

  pagination.innerHTML = `

    <button
      class="page-btn"
      ${page === 1 ? "disabled" : ""}
      data-page="${page-1}"
    >
      ←
    </button>

    ${Array.from(
      {length:end-start+1},
      (_,i)=>{

        const p = start+i;

        return `
          <button
            class="page-btn ${p===page ? "active":""}"
            data-page="${p}"
          >
            ${p}
          </button>
        `;
      }
    ).join("")}

    <button
      class="page-btn"
      ${page === totalPages ? "disabled" : ""}
      data-page="${page+1}"
    >
      →
    </button>

  `;

  pagination.querySelectorAll(".page-btn").forEach(btn=>{

    btn.addEventListener("click",()=>{

      const p = Number(btn.dataset.page);

      if(p >= 1 && p <= totalPages){
        callback(p);
      }

    });

  });

  app.appendChild(pagination);
}


/* -------------------------
   MOVIE DETAILS
------------------------- */

async function showMovie(id){

  currentMovieId = id;

  window.history.pushState(
    {page:"movie",id},
    "",
    "?movie=" + id
  );

  const app = document.getElementById("app");

  app.innerHTML = `
    <div class="loading">
      Loading movie details...
    </div>
  `;

  try{

    const [movie,credits,videos] = await Promise.all([

      getJSON(API + "/movie/" + id),

      getJSON(API + "/movie/" + id + "/credits"),

      getJSON(API + "/movie/" + id + "/videos")

    ]);

    currentMovie = movie;

    currentTrailer = findTrailer(videos.results || []);

    renderMovieDetails(movie,credits);

    loadRelatedMovies(movie);

  }catch(error){

    app.innerHTML = `
      <div class="error">
        Unable to load this movie.
      </div>
    `;
  }
}


/* -------------------------
   TRAILER FINDER
------------------------- */

function findTrailer(videos){

  const youtube = videos.filter(video =>
    video.site === "YouTube" &&
    video.key
  );

  if(!youtube.length) return null;

  // Prefer official trailers.
  const officialTrailer = youtube.find(video =>
    video.type === "Trailer" &&
    (
      video.official === true ||
      /official/i.test(video.name || "")
    )
  );

  if(officialTrailer) return officialTrailer;

  // Otherwise use a normal trailer.
  const normalTrailer = youtube.find(video =>
    video.type === "Trailer"
  );

  if(normalTrailer) return normalTrailer;

  return null;
}


/* -------------------------
   MOVIE DETAIL RENDER
------------------------- */

function renderMovieDetails(movie,credits){

  const app = document.getElementById("app");

  const cast = (credits.cast || [])
    .slice(0,10);

  const directors = (credits.crew || [])
    .filter(person => person.job === "Director");

  const genres = movie.genres || [];

  app.innerHTML = `

    <div class="detail">

      <button
        class="back-btn"
        onclick="goBack()"
      >
        ← Back
      </button>

      <div class="detail-top">

        <div>
          <img
            class="detail-poster"
            src="${poster(movie.poster_path)}"
            alt="${escapeHTML(movie.title)}"
          >
        </div>

        <div class="detail-content">

          <h1>
            ${escapeHTML(movie.title)}
          </h1>

          ${movie.tagline ? `
            <p class="movie-meta">
              ${escapeHTML(movie.tagline)}
            </p>
          ` : ""}

          <div class="tag-row">

            ${genres.map(genre => `
              <span class="tag">
                ${escapeHTML(genre.name)}
              </span>
            `).join("")}

          </div>

          <div class="movie-meta">

            ${movie.release_date
              ? formatDate(movie.release_date)
              : "Release date unavailable"}

            ${movie.runtime
              ? " • " + movie.runtime + " min"
              : ""}

            ${movie.vote_average
              ? " • ⭐ " + movie.vote_average.toFixed(1)
              : ""}

          </div>

          <p class="overview">
            ${escapeHTML(
              movie.overview ||
              "No description is available for this title."
            )}
          </p>

          ${
            currentTrailer
            ? `
              <button
                class="watch-btn"
                onclick="openTrailer()"
              >
                ▶ Watch Trailer
              </button>
            `
            : ""
          }

        </div>

      </div>


      <!-- CAST / DIRECTOR / RELEASE DATE -->

      <div class="details-box">

        <div class="info-row">

          <div class="info-label">
            Stars
          </div>

          <div class="info-value">

            ${
              cast.length
              ? cast.map(person => `

                  <div>
                    <span class="cast-name">
                      ${escapeHTML(person.name)}
                    </span>

                    ${
                      person.character
                      ? `
                        <span class="character">
                          — ${escapeHTML(person.character)}
                        </span>
                      `
                      : ""
                    }

                  </div>

                `).join("")
              : "Cast information unavailable."
            }

          </div>

        </div>


        <div class="info-row">

          <div class="info-label">
            Director
          </div>

          <div class="info-value">

            ${
              directors.length
              ? directors
                  .map(person => escapeHTML(person.name))
                  .join(", ")
              : "Director information unavailable."
            }

          </div>

        </div>


        <div class="info-row">

          <div class="info-label">
            Release Date
          </div>

          <div class="info-value">

            ${
              movie.release_date
              ? formatDate(movie.release_date)
              : "Release date unavailable."
            }

          </div>

        </div>

      </div>


      <!-- MORE LIKE THIS -->

      <section class="section">

        <div class="section-header">

          <h2>
            More Like This
          </h2>

        </div>

        <div id="relatedMovies" class="related-grid">

          <div class="loading">
            Finding similar movies...
          </div>

        </div>

      </section>

    </div>
  `;
}


/* -------------------------
   RELATED MOVIES
------------------------- */

async function loadRelatedMovies(movie){

  const container = document.getElementById("relatedMovies");

  if(!container) return;

  const genreIds = (movie.genres || [])
    .map(genre => genre.id);

  if(!genreIds.length){

    container.innerHTML = "";

    return;
  }

  try{

    /*
      "|" means OR in TMDB Discover.

      This gives us movies sharing at least
      one of the current movie's genres.
    */

    const data = await getJSON(
      API +
      "/discover?with_genres=" +
      genreIds.join("|") +
      "&sort_by=popularity.desc&page=1"
    );

    const movies = (data.results || [])
      .filter(item => item.id !== movie.id)
      .slice(0,6);

    if(!movies.length){

      container.innerHTML = `
        <div class="empty">
          No similar movies found.
        </div>
      `;

      return;
    }

    /*
      EXACTLY SIX MAXIMUM.
      NO PAGINATION.
    */

    container.innerHTML =
      movies.map(movieCard).join("");

  }catch(error){

    container.innerHTML = "";

  }
}


/* -------------------------
   TRAILER POPUP
------------------------- */

function openTrailer(){

  if(!currentTrailer) return;

  const modal =
    document.getElementById("trailerModal");

  const title =
    document.getElementById("trailerTitle");

  const frame =
    document.getElementById("trailerFrame");

  title.textContent =
    (currentMovie?.title || "Movie") +
    " Official Trailer";

  /*
    Autoplay starts because the popup
    was opened by a user click.
  */

  frame.src =
    "https://www.youtube.com/embed/" +
    encodeURIComponent(currentTrailer.key) +
    "?autoplay=1&rel=0";

  modal.classList.add("show");

  document.body.style.overflow = "hidden";
}


function closeTrailer(){

  const modal =
    document.getElementById("trailerModal");

  const frame =
    document.getElementById("trailerFrame");

  /*
    Removing the iframe source stops
    the YouTube video immediately.
  */

  frame.src = "";

  modal.classList.remove("show");

  document.body.style.overflow = "";
}


function handleModalBackground(event){

  if(event.target.id === "trailerModal"){
    closeTrailer();
  }
}


document.addEventListener("keydown",event=>{

  if(event.key === "Escape"){
    closeTrailer();
  }

});


/* -------------------------
   SEARCH
------------------------- */

document
  .getElementById("searchInput")
  .addEventListener("input",function(){

    const query = this.value.trim();

    clearTimeout(searchTimer);

    if(!query){

      loadMovies("popular",1);

      return;
    }

    searchTimer = setTimeout(
      ()=>searchMovies(query),
      400
    );

  });


async function searchMovies(query){

  const app = document.getElementById("app");

  app.innerHTML = `
    <div class="loading">
      Searching...
    </div>
  `;

  try{

    const data = await getJSON(
      API +
      "/search?query=" +
      encodeURIComponent(query) +
      "&page=1"
    );

    renderMovies(
      data.results || [],
      "Search Results"
    );

  }catch(error){

    app.innerHTML = `
      <div class="error">
        Search failed.
      </div>
    `;
  }
}


/* -------------------------
   GENRES
------------------------- */

async function loadGenres(){

  try{

    const data =
      await getJSON(API + "/genres");

    const container =
      document.getElementById("genreMenu");

    container.innerHTML =
      (data.genres || [])
      .map(genre => `

        <button
          class="menu-item"
          onclick="loadGenre(${genre.id},'${escapeHTML(genre.name)}')"
        >
          ${escapeHTML(genre.name)}
        </button>

      `)
      .join("");

  }catch(error){

    document.getElementById("genreMenu").innerHTML =
      `<div class="movie-meta">Genres unavailable.</div>`;

  }
}


async function loadGenre(id,name){

  closeMenu();

  const app = document.getElementById("app");

  app.innerHTML = `
    <div class="loading">
      Loading ${escapeHTML(name)} movies...
    </div>
  `;

  try{

    const data = await getJSON(
      API +
      "/discover?with_genres=" +
      id +
      "&sort_by=popularity.desc&page=1"
    );

    renderMovies(
      data.results || [],
      name + " Movies"
    );

    renderPagination(
      data.page || 1,
      data.total_pages || 1,
      function(page){

        loadGenrePage(id,name,page);

        window.scrollTo({
          top:0,
          behavior:"smooth"
        });

      }
    );

  }catch(error){

    app.innerHTML = `
      <div class="error">
        Unable to load this genre.
      </div>
    `;

  }
}


async function loadGenrePage(id,name,page){

  const app = document.getElementById("app");

  app.innerHTML = `
    <div class="loading">
      Loading...
    </div>
  `;

  try{

    const data = await getJSON(
      API +
      "/discover?with_genres=" +
      id +
      "&sort_by=popularity.desc&page=" +
      page
    );

    renderMovies(
      data.results || [],
      name + " Movies"
    );

    renderPagination(
      data.page || page,
      data.total_pages || 1,
      p => loadGenrePage(id,name,p)
    );

  }catch(error){

    app.innerHTML = `
      <div class="error">
        Unable to load this genre.
      </div>
    `;
  }
}


/* -------------------------
   MENU
------------------------- */

function openMenu(){

  document
    .getElementById("menu")
    .classList.add("open");

  document
    .getElementById("menuOverlay")
    .classList.add("show");
}


function closeMenu(){

  document
    .getElementById("menu")
    .classList.remove("open");

  document
    .getElementById("menuOverlay")
    .classList.remove("show");
}


/* -------------------------
   THEME
------------------------- */

function toggleTheme(){

  document.body.classList.toggle("light");

  localStorage.setItem(
    "theme",
    document.body.classList.contains("light")
      ? "light"
      : "dark"
  );
}


function loadSavedTheme(){

  const theme =
    localStorage.getItem("theme");

  if(theme === "light"){
    document.body.classList.add("light");
  }
}


/* -------------------------
   BACK BUTTON
------------------------- */

function goBack(){

  if(window.history.length > 1){

    window.history.back();

  }else{

    loadMovies("popular",1);

  }
}


window.addEventListener("popstate",function(){

  const params =
    new URLSearchParams(window.location.search);

  const movieId =
    params.get("movie");

  if(movieId){

    showMovieWithoutHistory(movieId);

  }else{

    loadMovies("popular",1);

  }

});


async function showMovieWithoutHistory(id){

  currentMovieId = id;

  const app = document.getElementById("app");

  app.innerHTML = `
    <div class="loading">
      Loading movie details...
    </div>
  `;

  try{

    const [movie,credits,videos] = await Promise.all([

      getJSON(API + "/movie/" + id),

      getJSON(API + "/movie/" + id + "/credits"),

      getJSON(API + "/movie/" + id + "/videos")

    ]);

    currentMovie = movie;

    currentTrailer =
      findTrailer(videos.results || []);

    renderMovieDetails(
      movie,
      credits
    );

    loadRelatedMovies(movie);

  }catch(error){

    app.innerHTML = `
      <div class="error">
        Unable to load this movie.
      </div>
    `;

  }
}
