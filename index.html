<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unstable Retards</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#0b0b0f;
  --card:#15151c;
  --card2:#1c1c25;
  --text:#f5f5f5;
  --muted:#9b9ba5;
  --accent:#e50914;
  --border:#292933;
  --yellow:#ffd21f;
  --skeleton:#24242c;
  --skeleton-highlight:#34343e;
}

body.light{
  --bg:#f5f5f7;
  --card:#ffffff;
  --card2:#eeeeF2;
  --text:#111;
  --muted:#666;
  --border:#ddd;
  --skeleton:#dedee3;
  --skeleton-highlight:#f2f2f5;
  --yellow:#c89400;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.2s;
}

button,input{
  font:inherit;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(11,11,15,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

body.light header{
  background:rgba(245,245,247,.94);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  font-family:Impact,"Arial Black",Arial,sans-serif;
  font-size:25px;
  font-weight:900;
  letter-spacing:-.5px;
  color:var(--text);
  cursor:pointer;
  white-space:nowrap;
  transition:.18s;
  text-shadow:0 2px 12px rgba(229,9,20,.22);
}

.logo:hover{
  transform:scale(1.02);
}

.header-spacer{
  flex:1;
}

.icon-btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  width:42px;
  height:42px;
  border-radius:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.18s;
}

.icon-btn:hover{
  border-color:var(--yellow);
  transform:translateY(-1px);
}

.icon-btn svg{
  width:21px;
  height:21px;
  display:block;
}

.search-wrap{
  max-width:1200px;
  margin:auto;
  padding:12px 16px 16px;
}

.search-wrap.hidden{
  display:none;
}

#searchInput{
  width:100%;
  padding:14px 16px;
  border-radius:13px;
  border:1px solid var(--border);
  outline:none;
  background:var(--card);
  color:var(--text);
}

#searchInput::placeholder{
  color:var(--muted);
}

main{
  max-width:1200px;
  margin:auto;
  padding:24px 16px 50px;
}

.hero{
  margin-bottom:28px;
}

.hero h1{
  font-size:30px;
  margin-bottom:7px;
}

.hero p{
  color:var(--muted);
}

.genre-heading{
  display:flex;
  align-items:center;
  gap:10px;
}

.genre-icon{
  width:23px;
  height:23px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.genre-icon svg{
  width:23px;
  height:23px;
}

.section{
  margin-top:30px;
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.section-header h2{
  font-size:22px;
}

.movie-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.movie-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:transform .18s,border-color .18s;
}

.movie-card:hover{
  transform:translateY(-3px);
  border-color:#555;
}

.poster{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  display:block;
  background:#222;
}

.movie-info{
  padding:11px;
}

.movie-title{
  font-weight:700;
  line-height:1.3;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.movie-meta{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:24px;
  flex-wrap:wrap;
}

.page-btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:9px 13px;
  border-radius:9px;
  cursor:pointer;
}

.page-btn.active{
  background:var(--accent);
  border-color:var(--accent);
  color:white;
}

.page-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}


/* SKELETON */

.skeleton{
  background:
    linear-gradient(
      110deg,
      var(--skeleton) 25%,
      var(--skeleton-highlight) 50%,
      var(--skeleton) 75%
    );
  background-size:200% 100%;
  animation:skeletonShimmer 1.35s linear infinite;
}

@keyframes skeletonShimmer{
  0%{background-position:200% 0;}
  100%{background-position:-200% 0;}
}

.skeleton-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.skeleton-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
}

.skeleton-poster{
  width:100%;
  aspect-ratio:2/3;
}

.skeleton-info{
  padding:11px;
}

.skeleton-title{
  height:16px;
  width:82%;
  border-radius:6px;
}

.skeleton-title.short{
  width:58%;
  margin-top:8px;
}

.skeleton-hero-title{
  height:30px;
  width:260px;
  border-radius:8px;
  margin-bottom:9px;
}

.skeleton-hero-text{
  height:14px;
  width:230px;
  border-radius:6px;
}

.detail-skeleton{
  max-width:1000px;
  margin:auto;
}

.skeleton-back{
  width:90px;
  height:40px;
  border-radius:10px;
  margin-bottom:20px;
}

.skeleton-detail-top{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:25px;
}

.skeleton-detail-poster{
  width:100%;
  aspect-ratio:2/3;
  border-radius:14px;
}

.skeleton-detail-title{
  width:75%;
  height:38px;
  border-radius:8px;
  margin-bottom:16px;
}

.skeleton-detail-line{
  width:45%;
  height:14px;
  border-radius:6px;
  margin-bottom:14px;
}

.skeleton-detail-line.medium{
  width:70%;
}

.skeleton-tags{
  display:flex;
  gap:7px;
  margin:15px 0;
}

.skeleton-tag{
  width:65px;
  height:28px;
  border-radius:999px;
}

.skeleton-overview{
  margin-top:16px;
}

.skeleton-overview-line{
  height:13px;
  border-radius:6px;
  margin-bottom:9px;
}

.skeleton-overview-line:nth-child(1){width:95%;}
.skeleton-overview-line:nth-child(2){width:88%;}
.skeleton-overview-line:nth-child(3){width:76%;}

.skeleton-button{
  width:145px;
  height:43px;
  border-radius:10px;
  margin-top:18px;
}

.skeleton-details-box{
  margin-top:28px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
}

.skeleton-info-row{
  display:grid;
  grid-template-columns:110px 1fr;
  gap:14px;
  padding:12px 0;
}

.skeleton-label{
  width:70px;
  height:14px;
  border-radius:6px;
}

.skeleton-value{
  width:65%;
  height:14px;
  border-radius:6px;
}


/* DETAILS */

.detail{
  max-width:1000px;
  margin:auto;
}

.back-btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:20px;
}

.detail-top{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:25px;
}

.detail-poster{
  width:100%;
  border-radius:14px;
  display:block;
}

.detail-content h1{
  font-size:38px;
  line-height:1.12;
  margin-bottom:8px;
  font-weight:900;
}

.movie-tagline{
  color:var(--yellow);
  font-size:17px;
  font-style:italic;
  font-weight:600;
  line-height:1.4;
  margin-bottom:12px;
}

.tag-row{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:13px 0;
}

.tag{
  background:var(--card2);
  border:1px solid var(--border);
  padding:6px 10px;
  border-radius:999px;
  color:var(--muted);
  font-size:13px;
  cursor:pointer;
  transition:.18s;
}

.tag:hover{
  color:var(--text);
  border-color:var(--yellow);
  transform:translateY(-1px);
}

.overview{
  color:var(--muted);
  font-size:13px;
  line-height:1.65;
  margin-top:12px;
}

.watch-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:18px;
  border:0;
  background:var(--accent);
  color:white;
  padding:12px 18px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

.details-box{
  margin-top:28px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
}

.info-row{
  display:grid;
  grid-template-columns:110px 1fr;
  gap:14px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}

.info-row:last-child{
  border-bottom:0;
}

.info-label{
  font-weight:800;
}

.info-value{
  color:var(--muted);
  line-height:1.6;
}

.cast-name{
  color:var(--text);
  font-weight:700;
}

.character{
  color:var(--muted);
}

.director-link{
  color:var(--text);
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}

.director-link:hover{
  color:var(--yellow);
}

.related-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}


/* ABOUT */

.about-page{
  max-width:850px;
  margin:auto;
}

.about-page h1{
  font-size:34px;
  margin-bottom:8px;
}

.about-tagline{
  color:var(--yellow);
  font-size:18px;
  font-style:italic;
  margin-bottom:25px;
}

.about-section{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px;
  margin-bottom:16px;
}

.about-section h2{
  margin-bottom:9px;
  font-size:20px;
}

.about-section p{
  color:var(--muted);
  line-height:1.7;
  font-size:14px;
}


/* TRAILER */

.modal{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.82);
}

.modal.show{
  display:flex;
}

.trailer-box{
  width:min(850px,100%);
  background:#111118;
  border:1px solid #333;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 20px 70px rgba(0,0,0,.7);
}

.trailer-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:15px 17px;
}

.trailer-title{
  font-weight:800;
  font-size:17px;
}

.close-btn{
  border:0;
  background:#24242d;
  color:white;
  width:35px;
  height:35px;
  border-radius:9px;
  cursor:pointer;
  font-size:20px;
}

.video-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}

.video-wrap iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}


/* MENU */

.menu{
  position:fixed;
  top:0;
  right:-310px;
  width:290px;
  height:100%;
  background:var(--card);
  border-left:1px solid var(--border);
  z-index:100;
  transition:.25s;
  padding:20px;
  overflow-y:auto;
}

.menu.open{
  right:0;
}

.menu-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.menu-title{
  font-size:20px;
  font-weight:800;
}

.menu-item{
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:var(--text);
  padding:13px 10px;
  border-radius:9px;
  cursor:pointer;
}

.menu-item:hover{
  background:var(--card2);
}

.menu-section{
  margin-top:20px;
  margin-bottom:7px;
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.menu-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:90;
  display:none;
}

.menu-overlay.show{
  display:block;
}

.loading,
.empty,
.error{
  text-align:center;
  padding:45px 10px;
  color:var(--muted);
}


/* FOOTER */

footer{
  max-width:1200px;
  margin:auto;
  padding:25px 16px 40px;
  color:var(--muted);
  font-size:12px;
  text-align:center;
  line-height:1.8;
}

.footer-links{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:16px;
  margin-bottom:12px;
}

.footer-link{
  color:var(--text);
  text-decoration:none;
  cursor:pointer;
}

.footer-link:hover{
  color:var(--yellow);
}

.footer-credit{
  margin-bottom:5px;
}

.footer-tmdb{
  opacity:.85;
}


/* RESPONSIVE */

@media(min-width:650px){

  .movie-grid,
  .skeleton-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .related-grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(min-width:900px){

  .movie-grid,
  .skeleton-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .related-grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:650px){

  .logo{
    font-size:20px;
  }

  .detail-top,
  .skeleton-detail-top{
    grid-template-columns:140px 1fr;
    gap:16px;
  }

  .detail-content h1{
    font-size:26px;
  }

  .movie-tagline{
    font-size:15px;
  }

  .info-row,
  .skeleton-info-row{
    grid-template-columns:90px 1fr;
  }

}

@media(max-width:450px){

  .detail-top,
  .skeleton-detail-top{
    grid-template-columns:1fr;
  }

  .detail-poster,
  .skeleton-detail-poster{
    max-width:220px;
    margin:auto;
  }

}

</style>
</head>

<body>

<header>

  <div class="header-inner">

    <div
      class="logo"
      onclick="goHome()"
    >
      Unstable Retards
    </div>

    <div class="header-spacer"></div>

    <!-- SEARCH -->

    <button
      id="searchIcon"
      class="icon-btn"
      onclick="showSearch()"
      aria-label="Search"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      >

        <circle
          cx="10.8"
          cy="10.8"
          r="6.5"
        ></circle>

        <line
          x1="16"
          y1="16"
          x2="21"
          y2="21"
        ></line>

      </svg>

    </button>


    <!-- THEME -->

    <button
      id="themeIcon"
      class="icon-btn"
      onclick="toggleTheme()"
      aria-label="Theme"
    >

      <svg
        id="themeSvg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></svg>

    </button>


    <!-- MENU -->

    <button
      class="icon-btn"
      onclick="openMenu()"
      aria-label="Menu"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
      >

        <line x1="4" y1="7" x2="20" y2="7"></line>
        <line x1="4" y1="12" x2="20" y2="12"></line>
        <line x1="4" y1="17" x2="20" y2="17"></line>

      </svg>

    </button>

  </div>


  <div
    id="searchWrap"
    class="search-wrap hidden"
  >

    <input
      id="searchInput"
      type="search"
      placeholder="Search movies..."
      autocomplete="off"
    >

  </div>

</header>


<div
  id="menuOverlay"
  class="menu-overlay"
  onclick="closeMenu()"
></div>


<aside
  id="menu"
  class="menu"
>

  <div class="menu-top">

    <div class="menu-title">
      Explore
    </div>

    <button
      class="close-btn"
      onclick="closeMenu()"
    >
      ×
    </button>

  </div>


  <button
    class="menu-item"
    onclick="loadHomeSection('popular')"
  >
    🔥 Popular
  </button>


  <button
    class="menu-item"
    onclick="loadHomeSection('top-rated')"
  >
    ⭐ Top Rated
  </button>


  <button
    class="menu-item"
    onclick="loadHomeSection('now-playing')"
  >
    🎬 Now Playing
  </button>


  <button
    class="menu-item"
    onclick="loadHomeSection('upcoming')"
  >
    🚀 Upcoming
  </button>


  <button
    class="menu-item"
    onclick="showAbout()"
  >
    ℹ️ About Us
  </button>


  <div class="menu-section">
    Genres
  </div>


  <div id="genreMenu"></div>

</aside>


<main id="app"></main>


<footer>

  <div class="footer-links">

    <span
      class="footer-link"
      onclick="showAbout()"
    >
      About Us
    </span>

  </div>

  <div class="footer-credit">
    Made by Aditya Chauhan • 2026
  </div>

  <div class="footer-tmdb">
    This product uses the TMDB API but is not endorsed or certified by TMDB.
  </div>

</footer>


<!-- TRAILER -->

<div
  id="trailerModal"
  class="modal"
  onclick="handleModalBackground(event)"
>

  <div class="trailer-box">

    <div class="trailer-header">

      <div
        id="trailerTitle"
        class="trailer-title"
      >
        Official Trailer
      </div>

      <button
        class="close-btn"
        onclick="closeTrailer()"
      >
        ×
      </button>

    </div>

    <div class="video-wrap">

      <iframe
        id="trailerFrame"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
      ></iframe>

    </div>

  </div>

</div>


<script>

const API =
  "https://movie-api.828477ww.workers.dev";

const IMAGE =
  "https://image.tmdb.org/t/p/w500";


let currentPage = 1;
let currentSection = "popular";
let currentMovieId = null;
let currentMovie = null;
let currentTrailer = null;
let currentGenreId = null;
let currentGenreName = null;
let currentDirectorId = null;
let currentDirectorName = null;

let genreCache = {};


/* -------------------------
   HELPERS
------------------------- */

function escapeHTML(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function poster(path){

  if(!path){
    return "https://via.placeholder.com/500x750?text=No+Poster";
  }

  return IMAGE + path;
}


function formatDate(date){

  if(!date){
    return "Not available";
  }

  const d =
    new Date(date + "T00:00:00");

  if(Number.isNaN(d.getTime())){
    return date;
  }

  return d.toLocaleDateString(
    "en-US",
    {
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );
}


async function getJSON(url){

  const response =
    await fetch(url);

  if(!response.ok){
    throw new Error("Request failed");
  }

  return await response.json();
}


/* -------------------------
   HOME
------------------------- */

function goHome(){

  closeMenu();
  hideSearch();

  currentSection = "popular";
  currentPage = 1;

  window.history.pushState(
    {
      page:"home",
      section:"popular"
    },
    "",
    window.location.pathname
  );

  loadMovies("popular",1);
}


async function loadHomeSection(section){

  closeMenu();
  hideSearch();

  currentSection = section;
  currentPage = 1;

  window.history.pushState(
    {
      page:"home",
      section
    },
    "",
    window.location.pathname
  );

  await loadMovies(section,1);
}


async function loadMovies(section,page){

  showMovieGridSkeleton();

  try{

    const data =
      await getJSON(
        API +
        "/" +
        section +
        "?page=" +
        page
      );

    renderMovies(
      data.results || [],

/* -------------------------
   PAGINATION
------------------------- */

function renderPagination(
  page,
  totalPages,
  callback
){

  const app =
    document.getElementById("app");

  if(totalPages <= 1){
    return;
  }

  const old =
    document.querySelector(".pagination");

  if(old){
    old.remove();
  }

  const pagination =
    document.createElement("div");

  pagination.className =
    "pagination";

  const maxButtons = 7;

  let start =
    Math.max(1,page-3);

  let end =
    Math.min(
      totalPages,
      start + maxButtons - 1
    );

  if(
    end-start <
    maxButtons-1
  ){

    start =
      Math.max(
        1,
        end-maxButtons+1
      );

  }

  pagination.innerHTML = `

    <button
      class="page-btn"
      ${page===1 ? "disabled" : ""}
      data-page="${page-1}"
    >
      ←
    </button>

    ${
      Array.from(
        {
          length:end-start+1
        },
        (_,i)=>{

          const p =
            start+i;

          return `

            <button
              class="page-btn ${
                p===page
                  ? "active"
                  : ""
              }"
              data-page="${p}"
            >
              ${p}
            </button>

          `;

        }
      ).join("")
    }

    <button
      class="page-btn"
      ${
        page===totalPages
          ? "disabled"
          : ""
      }
      data-page="${page+1}"
    >
      →
    </button>

  `;

  pagination
    .querySelectorAll(".page-btn")
    .forEach(btn=>{

      btn.addEventListener(
        "click",
        ()=>{

          const p =
            Number(btn.dataset.page);

          if(
            p>=1 &&
            p<=totalPages
          ){

            callback(p);

          }

        }
      );

    });

  app.appendChild(pagination);
}

      ),

      getJSON(

        id +
        "/videos"
      )

    ]);

    currentMovie = movie;

    currentTrailer =
      findTrailer(
        videos.results || []
      );

    renderMovieDetails(
      movie,
      credits
    );

    loadRelatedMovies(movie);

function findTrailer(videos){

  const youtube =
    videos.filter(
      video =>
        video.site === "YouTube" &&
        video.key
    );

  if(!youtube.length){
    return null;
  }

  const officialTrailer =
    youtube.find(
      video =>
        video.type === "Trailer" &&
        (
          video.official === true ||
          /official/i.test(
            video.name || ""
          )
        )
    );

  if(officialTrailer){
    return officialTrailer;
  }

  return youtube.find(
    video =>
      video.type === "Trailer"
  ) || null;
}

async function showDirector(
  id,
  name
){

  currentDirectorId = id;
  currentDirectorName = name;

  closeMenu();
  hideSearch();

  window.history.pushState(
    {
      page:"director",
      id,
      name
    },
    "",
    "?director=" +
    id
  );

  showMovieGridSkeleton();

  try{

    /*
      combined_credits contains the person's
      movie/TV credits. We filter it down to
      movies where this person is actually a
      Director.

      Therefore:
      - one director works
      - two directors work
      - three directors work
      - only movies directed by this person appear
    */

    const data =
      await getJSON(
        API +
        "/person/" +
        id +
        "/credits"
      );

    const directedMovies =
      (data.crew || [])
        .filter(
          item =>
            item.media_type === "movie" &&
            item.job === "Director"
        )
        .filter(
          (item,index,array) =>
            array.findIndex(
              movie =>
                movie.id === item.id
            ) === index
        )
        .sort(
          (a,b) =>
            (
              b.release_date || ""
            ).localeCompare(
              a.release_date || ""
            )
        );

    renderDirectorPage(
      name,
      directedMovies
    );

  }catch(error){

    document.getElementById("app").innerHTML = `
      <div class="error">
        Unable to load this director.
      </div>
    `;

  }

}

const searchInput =

searchInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key !== "Enter"
    ){
      return;
    }

    event.preventDefault();

    const query =
      this.value.trim();

    if(!query){
      return;
    }

    searchMovies(query);

    hideSearch();

  }
);

  document
    .getElementById(
      "searchWrap"
    )
    .classList.add("hidden");

  document
    .getElementById(
      "searchWrap"
    )
    .classList.remove("hidden");

  setTimeout(
    ()=>{
      searchInput.focus();
    },
    50
  );

}

/*

  anywhere outside the search area.
*/

document.addEventListener(
  "click",
  function(event){

    const searchWrap =
      document.getElementById(
        "searchWrap"
      );

    const searchIcon =
      document.getElementById(
        "searchIcon"
      );

    if(
      searchWrap.classList.contains("hidden")
    ){
      return;
    }

    if(
      searchWrap.contains(event.target) ||
      searchIcon.contains(event.target)
    ){
      return;
    }

    hideSearch();

  }
);

    </div>


    <section class="section">

      <div class="skeleton-grid">

            {length:12},
            ()=>`

              <div class="skeleton-card">

                  class="skeleton skeleton-poster"

    document.body.classList.contains(
      "light"
    );


  if(isLight){

      <circle
        cx="12"
        cy="12"
        r="4"
      ></circle>

      <line x1="12" y1="2" x2="12" y2="4"></line>
      <line x1="12" y1="20" x2="12" y2="22"></line>

      <line x1="2" y1="12" x2="4" y2="12"></line>
      <line x1="20" y1="12" x2="22" y2="12"></line>

      <line x1="4.9" y1="4.9" x2="6.3" y2="6.3"></line>
      <line x1="17.7" y1="17.7" x2="19.1" y2="19.1"></line>

      <line x1="17.7" y1="6.3" x2="19.1" y2="4.9"></line>
      <line x1="4.9" y1="19.1" x2="6.3" y2="17.7"></line>

    `;

  }else{

    /* CLEAN MOON — NO RANDOM DOTS */

    svg.innerHTML = `

      <path
        d="M20 15.5
           A8.5 8.5 0 0 1
           8.5 4
           A8.5 8.5 0 1 0
           20 15.5Z"
      ></path>

    `;

  }

}


function toggleTheme(){

  document.body
    .classList.toggle("light");

  localStorage.setItem(
    "theme",
    document.body.classList.contains("light")
      ? "light"
      : "dark"
  );

  updateThemeIcon();

}


function loadSavedTheme(){

  const theme =
    localStorage.getItem("theme");

  if(theme === "light"){

    document.body
      .classList.add("light");

  }

  updateThemeIcon();

}


/* -------------------------
   BACK / HISTORY
------------------------- */

function goBack(){

  if(window.history.length > 1){

    window.history.back();

  }else{

    goHome();

  }

}


window.addEventListener(
  "popstate",
  function(){

    const params =
      new URLSearchParams(
        window.location.search
      );

    const movieId =
      params.get("movie");

    const genre =
      params.get("genre");

    const about =
      params.get("about");

    const directorId =
      params.get("director");


    if(movieId){

      showMovieWithoutHistory(
        movieId
      );

    }else if(directorId){

      /*
        Reload the director page from
        the person's credits.
      */

      getJSON(
        API +
        "/person/" +
        directorId +
        "/credits"
      ).then(data => {

        const directed =
          (data.crew || [])
            .filter(
              item =>
                item.media_type === "movie" &&
                item.job === "Director"
            )
            .filter(
              (item,index,array) =>
                array.findIndex(
                  movie =>
                    movie.id === item.id
                ) === index
            )
            .sort(
              (a,b) =>
                (
                  b.release_date || ""
                ).localeCompare(
                  a.release_date || ""
                )
            );

        const directorName =
          directed[0]?.crew?.name ||
          currentDirectorName ||
          "Director";

        renderDirectorPage(
          currentDirectorName ||
          directorName,
          directed
        );

      }).catch(
        () => loadMovies("popular",1)
      );

    }else if(genre){

      findGenreIdByName(
        genre
      ).then(id => {

        if(id){

          loadGenrePage(
            id,
            genre,
            1
          );

        }else{

          loadMovies(
            "popular",
            1
          );

        }

      });

    }else if(about){

      showAbout();

    }else{

      loadMovies(
        "popular",
        1
      );

    }

  }
);


/* -------------------------
   GENRE ID HELPER
------------------------- */

async function findGenreIdByName(
  name
){

  if(
    genreCache[
      name.toLowerCase()
    ]
  ){

    return genreCache[
      name.toLowerCase()
    ];

  }

  try{

    const data =
      await getJSON(
        API + "/genres"
      );

    const found =
      (data.genres || [])
        .find(
          genre =>
            genre.name.toLowerCase() ===
            name.toLowerCase()
        );

    if(found){

      genreCache[
        name.toLowerCase()
      ] = found.id;

      return found.id;

    }

  }catch(error){}

  return 0;

}


/* -------------------------
   MOVIE WITHOUT HISTORY
------------------------- */

async function showMovieWithoutHistory(
  id
){

  currentMovieId = id;

  showMovieSkeleton();

  try{

    const [
      movie,
      credits,
      videos
    ] = await Promise.all([

      getJSON(
        API +
        "/movie/" +
        id
      ),

      getJSON(
        API +
        "/movie/" +
        id +
        "/credits"
      ),

      getJSON(
        API +
        "/movie/" +
        id +
        "/videos"
      )

    ]);

    currentMovie = movie;

    currentTrailer =
      findTrailer(
        videos.results || []
      );

    renderMovieDetails(
      movie,
      credits
    );

    loadRelatedMovies(
      movie
    );

  }catch(error){

    document.getElementById("app").innerHTML = `
      <div class="error">
        Unable to load this movie.
      </div>
    `;

  }

}
