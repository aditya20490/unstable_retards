<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unstable Retards 🎬</title>

<style>
:root {
  --bg: #0b0b0f;
  --card: #15151c;
  --text: #ffffff;
  --muted: #a1a1aa;
  --accent: #e50914;
  --border: #27272a;
}

body.light {
  --bg: #f4f4f5;
  --card: #ffffff;
  --text: #111113;
  --muted: #66666d;
  --border: #dddddf;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  transition: background 0.25s, color 0.25s;
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 22px;
  font-weight: 800;
}

.actions {
  display: flex;
  gap: 8px;
}

button {
  border: 0;
  cursor: pointer;
  color: var(--text);
  background: var(--card);
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  font-size: 20px;
}

.search-box {
  margin-top: 14px;
}

.search-box input {
  width: 100%;
  padding: 13px 15px;
  border-radius: 12px;
  border: 1px solid var(--border);
  outline: none;
  background: var(--card);
  color: var(--text);
  font-size: 16px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 20px 15px 40px;
}

h1 {
  margin: 5px 0 6px;
  font-size: 25px;
}

.subtitle {
  color: var(--muted);
  margin-bottom: 22px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 13px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.15s;
}

.card:hover {
  transform: translateY(-3px);
}

.poster {
  width: 100%;
  aspect-ratio: 2 / 3;
  object-fit: cover;
  display: block;
  background: #222;
}

.card-info {
  padding: 10px;
}

.card-title {
  font-weight: 700;
  font-size: 15px;
  line-height: 1.3;
}

.rating {
  margin-top: 6px;
  color: #fbbf24;
  font-size: 13px;
}

.date {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}

.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: 28px;
}

.page-btn {
  min-width: 40px;
  height: 40px;
  padding: 0 10px;
  border-radius: 9px;
  border: 1px solid var(--border);
}

.page-btn.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.page-btn:disabled {
  opacity: 0.4;
  cursor: default;
}

#status {
  text-align: center;
  color: var(--muted);
  margin: 25px 0;
}

.drawer {
  position: fixed;
  top: 0;
  left: -290px;
  width: 280px;
  height: 100vh;
  background: var(--card);
  z-index: 100;
  transition: left 0.25s;
  overflow-y: auto;
  border-right: 1px solid var(--border);
  padding: 20px;
}

.drawer.open {
  left: 0;
}

.drawer h2 {
  margin-top: 0;
}

.drawer button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 5px;
}

.drawer button:hover {
  background: var(--bg);
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 90;
  display: none;
}

.overlay.show {
  display: block;
}

.detail {
  max-width: 850px;
  margin: auto;
}

.back-btn {
  padding: 10px 14px;
  border-radius: 9px;
  margin-bottom: 18px;
}

.detail-header {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 22px;
}

.detail-poster {
  width: 100%;
  border-radius: 12px;
}

.detail h2 {
  font-size: 28px;
  margin-top: 0;
}

.meta {
  color: var(--muted);
  margin: 8px 0;
}

.genres {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 12px 0;
}

.genre {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 12px;
}

.overview {
  line-height: 1.6;
  color: var(--muted);
}

@media (min-width: 700px) {
  .grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

@media (max-width: 600px) {
  .detail-header {
    grid-template-columns: 120px 1fr;
    gap: 15px;
  }

  .detail h2 {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<header>
  <div class="topbar">

    <button class="icon-btn" onclick="openMenu()">☰</button>

    <div class="logo">Unstable Retards 🎬</div>

    <div class="actions">
      <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">☀️</button>
    </div>

  </div>

  <div class="search-box">
    <input
      id="searchInput"
      type="search"
      placeholder="Search movies..."
      onkeydown="handleSearch(event)"
    >
  </div>
</header>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="drawer" id="drawer">
  <h2>Movie Categories</h2>

  <button onclick="selectCategory('popular','🔥 Popular Movies',this)">
    🔥 Popular
  </button>

  <button onclick="selectCategory('top-rated','⭐ Top Rated',this)">
    ⭐ Top Rated
  </button>

  <button onclick="selectCategory('now-playing','🎬 Now Playing',this)">
    🎬 Now Playing
  </button>

  <button onclick="selectCategory('upcoming','🚀 Upcoming',this)">
    🚀 Upcoming
  </button>

  <hr>

  <h3>Genres</h3>

  <div id="genres">
    Loading genres...
  </div>
</div>

<main id="app"></main>

<script>

const API = "https://movie-api.828477ww.workers.dev";

let currentMode = "popular";
let currentPage = 1;
let totalPages = 1;
let currentTitle = "🔥 Popular Movies";
let currentQuery = "";
let currentGenre = "";

let genreMap = {};

function openMenu() {
  document.getElementById("drawer").classList.add("open");
  document.getElementById("overlay").classList.add("show");
}

function closeMenu() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

function toggleTheme() {
  document.body.classList.toggle("light");

  const light = document.body.classList.contains("light");

  document.getElementById("themeBtn").textContent =
    light ? "🌙" : "☀️";

  localStorage.setItem("theme", light ? "light" : "dark");
}

if (localStorage.getItem("theme") === "light") {
  document.body.classList.add("light");
  document.getElementById("themeBtn").textContent = "🌙";
}

function handleSearch(event) {
  if (event.key === "Enter") {
    const query = event.target.value.trim();

    if (!query) return;

    currentQuery = query;
    currentGenre = "";
    currentPage = 1;
    currentMode = "search";
    currentTitle = "🔎 Search: " + query;

    loadMovies();
    closeMenu();
  }
}

async function loadGenres() {
  try {
    const response = await fetch(API + "/genres");
    const data = await response.json();

    const container = document.getElementById("genres");

    container.innerHTML = "";

    data.genres.forEach(genre => {

      genreMap[genre.id] = genre.name;

      const button = document.createElement("button");

      button.textContent = genre.name;

      button.onclick = function() {
        selectGenre(genre.id, genre.name);
      };

      container.appendChild(button);
    });

  } catch (error) {
    document.getElementById("genres").textContent =
      "Could not load genres.";
  }
}

function selectCategory(mode, title) {
  currentMode = mode;
  currentTitle = title;
  currentPage = 1;
  currentQuery = "";
  currentGenre = "";

  document.getElementById("searchInput").value = "";

  closeMenu();

  loadMovies();
}

function selectGenre(id, name) {
  currentMode = "discover";
  currentGenre = id;
  currentTitle = "🎭 " + name;
  currentPage = 1;
  currentQuery = "";

  document.getElementById("searchInput").value = "";

  closeMenu();

  loadMovies();
}

function buildUrl() {

  if (currentMode === "search") {
    return API +
      "/search?query=" +
      encodeURIComponent(currentQuery) +
      "&page=" +
      currentPage;
  }

  if (currentMode === "discover") {
    return API +
      "/discover?with_genres=" +
      currentGenre +
      "&sort_by=popularity.desc&page=" +
      currentPage;
  }

  return API +
    "/" +
    currentMode +
    "?page=" +
    currentPage;
}

async function loadMovies() {

  const app = document.getElementById("app");

  app.innerHTML =
    "<div id='status'>Loading movies...</div>";

  try {

    const response = await fetch(buildUrl());
    const data = await response.json();

    if (!data.results) {
      throw new Error("No results");
    }

    totalPages = Math.min(data.total_pages || 1, 500);

    renderMovies(data.results);

  } catch (error) {

    app.innerHTML =
      "<div id='status'>Could not load movies. Please try again.</div>";
  }
}

function renderMovies(movies) {

  const app = document.getElementById("app");

  app.innerHTML = `
    <h1>${escapeHtml(currentTitle)}</h1>
    <div class="subtitle">
      Page ${currentPage} of ${totalPages}
    </div>

    <div class="grid" id="movieGrid"></div>

    <div class="pagination" id="pagination"></div>
  `;

  const grid = document.getElementById("movieGrid");

  movies.forEach(movie => {

    const card = document.createElement("div");

    card.className = "card";

    const poster = movie.poster_path
      ? "https://image.tmdb.org/t/p/w500" + movie.poster_path
      : "";

    card.innerHTML = `
      <img
        class="poster"
        src="${poster}"
        alt=""
        loading="lazy"
      >

      <div class="card-info">

        <div class="card-title">
          ${escapeHtml(movie.title || "Untitled")}
        </div>

        <div class="rating">
          ⭐ ${movie.vote_average
            ? movie.vote_average.toFixed(1)
            : "N/A"}
        </div>

        <div class="date">
          ${movie.release_date || "Release date unknown"}
        </div>

      </div>
    `;

    card.onclick = function() {
      openMovie(movie.id);
    };

    grid.appendChild(card);
  });

  renderPagination();
}

function renderPagination() {

  const container = document.getElementById("pagination");

  container.innerHTML = "";

  const previous = document.createElement("button");

  previous.className = "page-btn";
  previous.textContent = "‹";
  previous.disabled = currentPage === 1;

  previous.onclick = function() {
    if (currentPage > 1) {
      currentPage--;
      loadMovies();
      window.scrollTo(0, 0);
    }
  };

  container.appendChild(previous);

  let start = Math.max(1, currentPage - 2);
  let end = Math.min(totalPages, currentPage + 2);

  if (currentPage <= 3) {
    end = Math.min(5, totalPages);
  }

  if (currentPage >= totalPages - 2) {
    start = Math.max(1, totalPages - 4);
  }

  for (let i = start; i <= end; i++) {

    const button = document.createElement("button");

    button.className = "page-btn";

    if (i === currentPage) {
      button.classList.add("active");
    }

    button.textContent = i;

    button.onclick = function() {
      currentPage = i;
      loadMovies();
      window.scrollTo(0, 0);
    };

    container.appendChild(button);
  }

  const next = document.createElement("button");

  next.className = "page-btn";
  next.textContent = "›";
  next.disabled = currentPage === totalPages;

  next.onclick = function() {
    if (currentPage < totalPages) {
      currentPage++;
      loadMovies();
      window.scrollTo(0, 0);
    }
  };

  container.appendChild(next);
}

async function openMovie(id) {

  history.pushState(
    { movie: id },
    "",
    "#movie-" + id
  );

  await showMovie(id);
}

async function showMovie(id) {

  const app = document.getElementById("app");

  app.innerHTML =
    "<div id='status'>Loading movie...</div>";

  try {

    const response = await fetch(API + "/movie/" + id);
    const movie = await response.json();

    const poster = movie.poster_path
      ? "https://image.tmdb.org/t/p/w500" + movie.poster_path
      : "";

    const genres = (movie.genres || [])
      .map(g => `<span class="genre">${escapeHtml(g.name)}</span>`)
      .join("");

    app.innerHTML = `
      <div class="detail">

        <button class="back-btn" onclick="goBack()">
          ← Back
        </button>

        <div class="detail-header">

          <img
            class="detail-poster"
            src="${poster}"
            alt=""
          >

          <div>

            <h2>${escapeHtml(movie.title || "")}</h2>

            <div class="meta">
              ⭐ ${movie.vote_average
                ? movie.vote_average.toFixed(1)
                : "N/A"}
            </div>

            <div class="meta">
              📅 ${movie.release_date || "Unknown"}
            </div>

            <div class="genres">
              ${genres}
            </div>

          </div>

        </div>

        <h3>Overview</h3>

        <div class="overview">
          ${escapeHtml(movie.overview || "No overview available.")}
        </div>

      </div>
    `;

    window.scrollTo(0, 0);

  } catch (error) {

    app.innerHTML =
      "<div id='status'>Could not load movie.</div>";
  }
}

function goBack() {

  if (history.state && history.state.movie) {
    history.back();
  } else {
    loadMovies();
  }
}

window.addEventListener("popstate", function() {

  if (location.hash.startsWith("#movie-")) {

    const id = location.hash.replace("#movie-", "");

    showMovie(id);

  } else {

    loadMovies();
  }

});

function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

loadGenres();
loadMovies();

</script>

</body>
</html>
